# ════════════════════════════════════════════════════════════════════
#  _data/profile.yml - single source of truth for /profile/
# ════════════════════════════════════════════════════════════════════
#  Every count, card, timeline bar and JSON-LD entry on the profile page
#  is generated from this file. To add an achievement, add ONE entry to
#  the right list; the page, totals and timeline update on the next build.
#
#  Item fields (all optional except title):
#    title         headline of the item
#    org           issuing / organizing body
#    role          your role (judge, reviewer, author, ...)
#    date          display date, e.g. "Jun 2026" or "2024-2026"
#    year          4-digit year used for the timeline (omit to exclude)
#    location      city / country / "Online"
#    summary       one or two factual sentences
#    significance  why it is selective / notable (only verified facts)
#    evidence      list of { label, url } proof links
#    kind          sub-type label shown as a chip
#
#  House rule: nothing goes in here that cannot be backed by a source.
#  Items with no significance/evidence simply render without the
#  evidence panel - the page never shows empty placeholders.
# ════════════════════════════════════════════════════════════════════

