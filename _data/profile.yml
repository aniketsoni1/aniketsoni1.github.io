    summary: "Designs and builds enterprise data platforms for healthcare, asset and wealth management, and business financial-services clients. Promoted effective November 1, 2024."
    highlights:
      - "Since April 2026, architecting a healthcare claims-integrity and anomaly-detection platform: an end-to-end ML scoring pipeline on Databricks Delta Live Tables and Unity Catalog, using a Bronze/Silver/Gold medallion design with schema-driven data contracts, streaming data-quality validation and automated quarantine."
      - "Designed a three-signal scoring framework combining CatBoost (63 clinical features), K-Means provider clustering (15 behavioral features) and LSTM patient-history analysis (110 sequence features), backed by a 188-feature registry."
      - "Built PHI-free observability with drift detection (PSI, KL-divergence), SHA-256 audit manifests and tokenization-based privacy controls, so every scored result is reproducible."
      - "Made onboarding a new health plan a YAML-only change with zero code modifications, and established CI/CD across four environments with AWS CDK, Terraform and Databricks Asset Bundles."
      - "Automated high-volume ETL in Databricks and Snowflake processing 10M+ records per day from claims, custodial, trading, portfolio and reference systems."
      - "Built Slack and Databricks incident monitoring that cut pipeline-failure resolution time by 60%; governance and validation frameworks improved data accuracy by 30-35% and reduced reporting errors by 37%."
      - "Led Eagle workflow exploration in asset and wealth management, reducing requirement ambiguity by 40%; GitLab-based CI/CD practices cut deployment issues by 20%."
      - "Mentors junior analysts and engineers on SQL optimization, data modeling and pipeline design, cutting onboarding time by 30%."
