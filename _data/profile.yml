# ── 07 · Leading & Critical Role ─────────────────────────────────────
roles:
  - title: "Senior Data Engineer"
    org: "Cognizant Technology Solutions"
    location: "New York, NY"
    date: "Mar 2021 - present"
    year: 2021
    summary: "Designs and builds enterprise data platforms for healthcare and financial-services clients."
    highlights:
      - "Architected an end-to-end ML scoring pipeline for a healthcare claims-integrity and anomaly-detection platform on Databricks Delta Live Tables and Unity Catalog, using a Bronze/Silver/Gold medallion design with streaming data-quality validation and automated quarantine (2026 - present)."
      - "Designed a three-signal scoring framework combining CatBoost (63 clinical features), K-Means provider clustering (15 behavioral features) and LSTM patient-history analysis (110 sequence features), backed by a 188-feature registry."
      - "Built PHI-free observability with drift detection (PSI, KL-divergence) and SHA-256 audit manifests so every scored result is reproducible."
      - "Made onboarding a new health plan a YAML-only change with zero code modifications, and established CI/CD across four environments with AWS CDK, Terraform and Databricks Asset Bundles."
      - "Automated high-volume ETL in Databricks and Snowflake processing 10M+ records per day from custodial, trading and reference systems (2021 - 2025)."
      - "Built Slack and Databricks incident monitoring that cut pipeline-failure resolution time by 60%, and governance frameworks that improved data accuracy by 30-35% and reduced reporting errors by 37%."
      - "Mentors junior analysts and engineers on SQL optimization, data modeling and pipeline design, cutting onboarding time by 30%."
  - title: "Research Analyst"
    org: "Climate Change Xplorers"
    location: "New York, NY"
    date: "Sep 2020 - Mar 2021"
    year: 2020
    summary: "Built the data pipelines and analysis behind a global weather-station siting study: ETL ingesting ~10K records per day from five sources and analysis of 150M+ data points across eight FSI categories."

