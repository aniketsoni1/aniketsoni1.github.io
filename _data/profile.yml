# ── 07 · Leading & Critical Role ─────────────────────────────────────
roles:
  - title: "Senior Data Engineer"
    org: "Cognizant Technology Solutions"
    location: "New York, NY"
    date: "Mar 2021 - present · promoted Nov 2024"
    summary: "Designs and builds enterprise data platforms for healthcare, asset and wealth management, and business financial-services clients. Promoted effective November 1, 2024."
    highlights:
      - "Since April 2026, architecting a healthcare claims-integrity and anomaly-detection platform: an end-to-end ML scoring pipeline on Databricks Delta Live Tables and Unity Catalog, using a Bronze/Silver/Gold medallion design with schema-driven data contracts, streaming data-quality validation and automated quarantine."
